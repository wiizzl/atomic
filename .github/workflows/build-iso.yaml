name: Build ISO

on:
  push:
    branches: [main]
    paths:
      - image/install.ks
      - .github/workflows/build-iso.yaml
      - .github/workflows/variants.yaml
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/atomic

jobs:
  variants:
    uses: ./.github/workflows/variants.yaml

  build:
    name: ${{ matrix.tag }}
    needs: variants
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        tag: ${{ fromJson(needs.variants.outputs.isos) }}
    steps:
      - uses: actions/checkout@v7

      - name: Build ISO
        env:
          RELEASES: https://download.fedoraproject.org/pub/fedora/linux/releases
        run: |
          kernel="$(skopeo inspect --format '{{ index .Labels "ostree.linux" }}' "docker://$IMAGE:${{ matrix.tag }}")"
          fedora="$(grep -oP '\.fc\K[0-9]+' <<<"$kernel")"
          url="$RELEASES/$fedora/Everything/x86_64/iso"
          listing="$(curl -fsSL "$url/")"
          netinst="$(grep -oE "Fedora-Everything-netinst-x86_64-$fedora-[0-9.]+\.iso" <<<"$listing" | sort -uV | tail -1)"
          checksum="$(grep -oE "Fedora-Everything-$fedora-[0-9.]+-x86_64-CHECKSUM" <<<"$listing" | sort -uV | tail -1)"
          curl -fsSLO "$url/$netinst"
          curl -fsSL "$url/$checksum" | grep -F "($netinst)" | sha256sum -c -

          sed "s/@TAG@/${{ matrix.tag }}/" image/install.ks >install.ks
          sudo podman run --rm --privileged -v /dev:/dev -v .:/work -w /work \
            "registry.fedoraproject.org/fedora:$fedora" \
            sh -c "dnf install -y lorax && mkksiso --ks install.ks '$netinst' 'atomic-${{ matrix.tag }}.iso'"
          sudo chown "$(id -u):$(id -g)" "atomic-${{ matrix.tag }}.iso"
          sha256sum "atomic-${{ matrix.tag }}.iso" >"atomic-${{ matrix.tag }}.iso.sha256"

      - name: Upload to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          for file in "atomic-${{ matrix.tag }}.iso" "atomic-${{ matrix.tag }}.iso.sha256"; do
            aws s3 cp --endpoint-url "$ENDPOINT" "$file" "s3://${{ secrets.R2_BUCKET }}/$file"
          done
