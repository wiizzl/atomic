[theme]
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-tonal-spot"

[theme.templates]
enable_builtin_templates = true
builtin_ids = ["gtk3", "gtk4", "qt", "kitty", "umbriel"]
enable_community_templates = true
community_ids = ["bat", "discord", "strata"]

[theme.templates.user.zed_custom]
input_path = "$XDG_CONFIG_HOME/noctalia/templates/zed-custom.json"
output_path = "$XDG_CONFIG_HOME/zed/themes/noctalia-custom.json"
